plugins {
  id 'com.android.application'
}

android {
  namespace "pl.whisperlive"
  compileSdkVersion 36

  lint {
    disable 'ExpiredTargetSdkVersion'
  }

  defaultConfig {
    applicationId "pl.whisperlive"
    minSdkVersion 29
    targetSdkVersion 31
    versionCode 3
    versionName "1.1.0"

    externalNativeBuild {
      cmake {
        cppFlags ""
        arguments "-DCMAKE_BUILD_TYPE=Release"
      }
    }
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  buildTypes {
    debug {
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
    release {
      // CI signs the unsigned release in a separate job. Preserve local debug signing.
      if (System.getenv("WHISPER_CI_UNSIGNED") != "1") {
        signingConfig signingConfigs.debug
      }
      minifyEnabled false
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/jni/whisper/CMakeLists.txt"
      if (System.getenv("WHISPER_CI_UNSIGNED") == "1") {
        version "3.22.1"
      }
    }
  }

  ndkVersion "25.2.9519653"

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
}
