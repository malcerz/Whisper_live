plugins {
  id 'com.android.application'
}

// Opcjonalny wspólny klucz podpisu (GitHub Actions: sekrety KEYSTORE_BASE64, KEYSTORE_PASSWORD,
// KEY_ALIAS, KEY_PASSWORD). Bez niego APK jest podpisywany lokalnym kluczem debug.
def keystorePath = System.getenv("KEYSTORE_FILE")
def hasSigningKey = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
  namespace "pl.whisperlive"
  compileSdkVersion 36

  signingConfigs {
    if (hasSigningKey) {
      shared {
        storeFile file(keystorePath)
        storePassword System.getenv("KEYSTORE_PASSWORD")
        keyAlias System.getenv("KEY_ALIAS")
        keyPassword System.getenv("KEY_PASSWORD")
      }
    }
  }

  lint {
    disable 'ExpiredTargetSdkVersion'
  }

  defaultConfig {
    applicationId "pl.whisperlive"
    minSdkVersion 29
    targetSdkVersion 31
    versionCode 2
    versionName "1.1.0"

    externalNativeBuild {
      cmake {
        cppFlags ""
        arguments "-DCMAKE_BUILD_TYPE=Release"
      }
    }
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  buildTypes {
    debug {
      if (hasSigningKey) signingConfig signingConfigs.shared
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
    release {
      signingConfig hasSigningKey ? signingConfigs.shared : signingConfigs.debug
      minifyEnabled false
      externalNativeBuild {
        cmake { arguments "-DCMAKE_BUILD_TYPE=Release" }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "src/main/jni/whisper/CMakeLists.txt"
    }
  }

  ndkVersion "25.2.9519653"

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
}
