name: Build signed WhisperLive APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Compile unsigned arm64 release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WHISPER_CI_UNSIGNED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Apply WhisperLive overlay to bundled whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          project=whisper.cpp/examples/whisper.android.java
          test -d "$project"
          rm -rf "$project/app/src/main/java" "$project/app/src/main/res"
          mkdir -p "$project/app/src/main/java"
          cp -a overlay/app/. "$project/app/"
          cp root-patches/build.gradle root-patches/gradle.properties "$project/"
          cp root-patches/gradle-wrapper.properties "$project/gradle/wrapper/"
          chmod +x "$project/gradlew"
      - name: Compile unsigned APK
        working-directory: whisper.cpp/examples/whisper.android.java
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - name: Collect unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          apk=whisper.cpp/examples/whisper.android.java/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$apk"
          mkdir -p unsigned
          cp "$apk" unsigned/WhisperLive-arm64-release-unsigned.apk
      - name: Upload intermediate APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperLive-unsigned-intermediate
          path: unsigned/WhisperLive-arm64-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign and verify developer APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: WhisperLive-unsigned-intermediate
          path: unsigned
      - name: Sign and verify APK certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Signing secret missing: $name. Copy secrets from AndroidBrama before signing."
              exit 1
            fi
          done
          umask 077
          keyfile="$(mktemp "$RUNNER_TEMP/whisper-release.XXXXXX.p12")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          expected="$(keytool -exportcert -keystore "$keyfile" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p signed
          "$tools/zipalign" -P 16 -f 4 unsigned/WhisperLive-arm64-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apk=signed/WhisperLive-arm64-release.apk
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$apk"
          actual="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':[:space:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::APK certificate does not match the developer key"
            exit 1
          fi
          printf 'APK_SIGNING_MODE=developer-keystore\nCERTIFICATE_SHA256=%s\n' "$actual" > signed/signing-info.txt
          echo "::notice::APK signature verified against the developer keystore."
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WhisperLive-APK
          path: signed/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified APK to GitHub Releases
    needs: sign
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: WhisperLive-APK
          path: signed
      - name: Publish versioned signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' overlay/app/build.gradle | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine application version"
            exit 1
          fi
          TAG="v$VERSION"
          test -s signed/WhisperLive-arm64-release.apk
          grep -q '^APK_SIGNING_MODE=developer-keystore$' signed/signing-info.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          {
            echo "WhisperLive Android $TAG, arm64-v8a"
            echo
            echo "APK podpisano zweryfikowanym kluczem developerskim GitHub Actions."
            echo "Szczegoly podpisu: podpisany artifact zawiera signing-info.txt."
            echo
            echo "Kod z commitu: $GITHUB_SHA"
          } > release-notes.md
          gh release create "$TAG" \
            "signed/WhisperLive-arm64-release.apk#WhisperLive-$TAG-arm64-release.apk" \
            --target "$GITHUB_SHA" \
            --title "WhisperLive $TAG" \
            --notes-file release-notes.md
