name: Build Whisper Live APK

on:
  push:
    branches: [master, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PROJECT: whisper.cpp/examples/whisper.android.java

jobs:
  build-apk:
    name: Compile APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same steps as build_windows.ps1: put the Whisper Live sources on top of
      # the whisper.cpp Android example project.
      - name: Apply Whisper Live overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANDROID_PROJECT/app/src/main/java" "$ANDROID_PROJECT/app/src/main/res"
          mkdir -p "$ANDROID_PROJECT/app/src/main/java"
          cp -R overlay/app/. "$ANDROID_PROJECT/app/"
          cp root-patches/build.gradle "$ANDROID_PROJECT/build.gradle"
          cp root-patches/gradle.properties "$ANDROID_PROJECT/gradle.properties"
          cp root-patches/gradle-wrapper.properties "$ANDROID_PROJECT/gradle/wrapper/gradle-wrapper.properties"

      - name: Validate optional developer signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::KEYSTORE_BASE64 missing: APKs will use the runner's debug key."
            echo "APK_SIGNING_MODE=debug-fallback" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$SIGN_STORE_PASSWORD" ] || [ -z "$SIGN_KEY_ALIAS" ] || [ -z "$SIGN_KEY_PASSWORD" ]; then
            echo "::error::Signing secret set incomplete. Expected KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"; then
            echo "::error::KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.p12" -storepass "$SIGN_STORE_PASSWORD" -alias "$SIGN_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot open keystore or signing alias. Verify KEYSTORE_PASSWORD, KEY_ALIAS and file format."
            exit 1
          fi
          echo "APK_SIGNING_MODE=developer-keystore" >> "$GITHUB_ENV"
          printf 'KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          printf 'KEYSTORE_PASSWORD=%s\n' "$SIGN_STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'KEY_ALIAS=%s\n' "$SIGN_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'KEY_PASSWORD=%s\n' "$SIGN_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "::notice::Developer signing keystore validated; no key contents are logged."

      - name: Compile debug and release APKs
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*versionName "\(.*\)".*/\1/p' overlay/app/build.gradle | head -n 1)"
          mkdir -p dist
          cp "$ANDROID_PROJECT/app/build/outputs/apk/debug/app-debug.apk" "dist/WhisperLive-v$VERSION-arm64-debug.apk"
          cp "$ANDROID_PROJECT/app/build/outputs/apk/release/app-release.apk" "dist/WhisperLive-v$VERSION-arm64-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for APK in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: /'"$(basename "$APK")"' SHA-256: /p'
          done
          printf 'APK_SIGNING_MODE=%s\n' "${APK_SIGNING_MODE:-debug-fallback}" > dist/signing-info.txt
          ls -l dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WhisperLive-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    # On master (or a v* tag) a release is published only when none exists yet
    # for the versionName in overlay/app/build.gradle.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: WhisperLive-APK
          path: apk

      - name: Create release with APK files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(sed -n 's/^[[:space:]]*versionName "\(.*\)".*/\1/p' overlay/app/build.gradle | head -n 1)"
            if [ -z "$VERSION" ]; then
              echo "::error::Cannot read versionName from overlay/app/build.gradle."
              exit 1
            fi
            TAG="v$VERSION"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; nothing to publish."
            exit 0
          fi
          SIGNING="$(sed -n 's/^APK_SIGNING_MODE=//p' apk/signing-info.txt 2>/dev/null || true)"
          {
            echo "Signing mode: ${SIGNING:-unknown}"
            if [ "${SIGNING:-}" != "developer-keystore" ]; then
              echo
              echo "Signed with a temporary debug key: it cannot be installed over a copy signed with another key."
            fi
          } > release-notes.md
          gh release create "$TAG" apk/*.apk \
            --target "$GITHUB_SHA" \
            --title "Whisper Live $TAG" \
            --notes-file release-notes.md \
            --generate-notes
